
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Rush 4K</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #071321;
  font-family: Arial, sans-serif;
  color: white;
}
#game { width: 100vw; height: 100vh; }
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}
.panel {
  background: #071321cc;
  padding: 12px 16px;
  border: 1px solid #ffffff40;
  border-radius: 12px;
}
#controls {
  position: absolute;
  bottom: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
}
.control {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid white;
  background: #122b45cc;
  color: white;
  font-size: 30px;
  touch-action: none;
}
#start {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #061321dd;
  text-align: center;
  padding: 20px;
}
#start button {
  padding: 16px 35px;
  border: none;
  border-radius: 30px;
  background: #e21c35;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">🎄 CHRISTMAS RUSH 4K</div>
  <div class="panel">🏁 Speed: <span id="speed">0</span> km/h</div>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<div id="start">
  <h1>🎄 CHRISTMAS RUSH 4K</h1>
  <p>THE ULTIMATE WINTER RACING EXPERIENCE</p>
  <p>Drive through a magical Christmas world!</p>
  <button id="play">START RACING 🏎️</button>
</div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07172b);
scene.fog = new THREE.Fog(0x07172b, 35, 160);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 500
);
camera.position.set(0, 5, 11);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.getElementById('game').appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0x9fcfff, 0x293b4a, 2));

const moonLight = new THREE.DirectionalLight(0xffffff, 2.5);
moonLight.position.set(-10, 20, 10);
moonLight.castShadow = true;
scene.add(moonLight);

// Snow ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 400),
  new THREE.MeshStandardMaterial({ color: 0xdcecff })
);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -100;
ground.receiveShadow = true;
scene.add(ground);

// Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 400),
  new THREE.MeshStandardMaterial({ color: 0x202b38, roughness: 0.8 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.03;
road.position.z = -100;
scene.add(road);

// Road markings
for (let z = -190; z < 20; z += 12) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.025, 5),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  line.position.set(0, 0.06, z);
  scene.add(line);
}

// Racing car
const car = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(2, 0.65, 3.8),
  new THREE.MeshStandardMaterial({
    color: 0xc90024,
    metalness: 0.75,
    roughness: 0.25
  })
);
body.position.y = 0.85;
body.castShadow = true;
car.add(body);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 0.7, 1.8),
  new THREE.MeshStandardMaterial({
    color: 0x152b40,
    metalness: 0.6,
    roughness: 0.15
  })
);
cabin.position.set(0, 1.5, -0.2);
car.add(cabin);

// Wheels
const wheels = [];
for (const x of [-1.05, 1.05]) {
  for (const z of [-1.2, 1.2]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.28, 24),
      new THREE.MeshStandardMaterial({ color: 0x080808 })
    );
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.48, z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// Headlights
for (const x of [-0.65, 0.65]) {
  const light = new THREE.PointLight(0xffffff, 18, 25);
  light.position.set(x, 1, -2);
  car.add(light);
}
car.position.z = 3;
scene.add(car);

// Christmas trees
const trees = [];
for (let z = -10; z > -190; z -= 12) {
  for (const side of [-1, 1]) {
    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.3, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0x59331d })
    );
    trunk.position.y = 0.5;
    tree.add(trunk);

    for (let i = 0; i < 3; i++) {
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.25 - i * 0.2, 2, 8),
        new THREE.MeshStandardMaterial({ color: 0x07502c })
      );
      leaves.position.y = 1.6 + i * 0.8;
      tree.add(leaves);
    }

    tree.position.set(side * (9 + Math.random() * 12), 0, z);
    scene.add(tree);
    trees.push(tree);
  }
}

// Falling snow
const snowCount = 1800;
const snowPositions = new Float32Array(snowCount * 3);

for (let i = 0; i < snowCount; i++) {
  snowPositions[i * 3] = (Math.random() - 0.5) * 100;
  snowPositions[i * 3 + 1] = Math.random() * 35;
  snowPositions[i * 3 + 2] = -Math.random() * 150;
}

const snowGeometry = new THREE.BufferGeometry();
snowGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(snowPositions, 3)
);

const snow = new THREE.Points(
  snowGeometry,
  new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.12
  })
);
scene.add(snow);

// Game controls
let steering = 0;
let speed = 0;
let playing = false;
let carX = 0;

function bindControl(id, direction) {
  const button = document.getElementById(id);

  button.addEventListener('pointerdown', e => {
    e.preventDefault();
    steering = direction;
  });

  button.addEventListener('pointerup', () => steering = 0);
  button.addEventListener('pointerleave', () => steering = 0);
  button.addEventListener('pointercancel', () => steering = 0);
}

bindControl('left', -1);
bindControl('right', 1);

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') steering = -1;
  if (e.key === 'ArrowRight' || e.key === 'd') steering = 1;
});

window.addEventListener('keyup', () => steering = 0);

document.getElementById('play').onclick = () => {
  playing = true;
  speed = 80;
  document.getElementById('start').style.display = 'none';
};

// Animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (playing) {
    speed = Math.min(speed + 5 * delta, 220);

    carX += steering * 8 * delta;
    carX = THREE.MathUtils.clamp(carX, -4.5, 4.5);
    car.position.x = carX;

    car.rotation.z = -steering * 0.12;

    wheels.forEach(wheel => {
      wheel.rotation.x += speed * delta * 0.08;
    });

    document.getElementById('speed').textContent =
      Math.round(speed);

    trees.forEach(tree => {
      tree.position.z += speed * delta * 0.18;
      if (tree.position.z > 15) tree.position.z -= 200;
    });

    const positions = snow.geometry.attributes.position.array;
    for (let i = 0; i < snowCount; i++) {
      positions[i * 3 + 1] -= delta * 5;
      positions[i * 3 + 2] += speed * delta * 0.1;

      if (positions[i * 3 + 1] < 0) {
        positions[i * 3 + 1] = 35;
      }
      if (positions[i * 3 + 2] > 10) {
        positions[i * 3 + 2] = -150;
      }
    }
    snow.geometry.attributes.position.needsUpdate = true;
  }

  camera.position.x += (car.position.x * 0.45 - camera.position.x) * 0.05;
  camera.lookAt(car.position.x * 0.35, 1, -5);

  renderer.render(scene, camera);
}

animate();

// Screen resizing
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
  </html>
