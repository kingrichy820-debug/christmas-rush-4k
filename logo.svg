
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#fff5a0"/>
      <stop offset=".45" stop-color="#ffbd18"/>
      <stop offset="1" stop-color="#a85b00"/>
    </linearGradient>
    <linearGradient id="red" x2="0" y2="1">
      <stop stop-color="#ff4545"/>
      <stop offset="1" stop-color="#790000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="45" fill="#071126"/>
  <rect x="12" y="12" width="776" height="476" rx="38"
        fill="none" stroke="url(#gold)" stroke-width="7"/>

  <!-- Royal crown -->
  <g filter="url(#glow)">
    <path d="M300 145 L265 65 L345 105 L400 25
             L455 105 L535 65 L500 145 Z"
          fill="url(#gold)" stroke="#fff0a0" stroke-width="7"/>
    <path d="M300 145 H500 L480 185 H320 Z"
          fill="url(#gold)" stroke="#a85b00" stroke-width="5"/>
    <g fill="#d80024">
      <circle cx="400" cy="92" r="12"/>
      <circle cx="345" cy="119" r="9"/>
      <circle cx="455" cy="119" r="9"/>
    </g>
  </g>

  <text x="400" y="225" text-anchor="middle"
        font-family="Arial" font-size="48"
        font-weight="900" fill="url(#gold)">
    KING RICHY'S
  </text>

  <text x="400" y="305" text-anchor="middle"
        font-family="Arial" font-size="66"
        font-weight="900" fill="url(#red)"
        stroke="#ffffff" stroke-width="2">
    CHRISTMAS
  </text>

  <text x="400" y="370" text-anchor="middle"
        font-family="Arial" font-size="65"
        font-weight="900" fill="url(#gold)">
    RUSH 4K
  </text>

  <path d="M110 390 H690" stroke="url(#gold)" stroke-width="4"/>

  <text x="400" y="425" text-anchor="middle"
        font-family="Arial" font-size="23"
        font-weight="bold" fill="white">
    KING RICHY STUDIOS
  </text>

  <text x="400" y="460" text-anchor="middle"
        font-family="Arial" font-size="17"
        fill="#ffcc55">
    CREATED BY BADZI KING RICHMOND
  </text>
</svg>
        
